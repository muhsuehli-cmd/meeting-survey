<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會議與課程出席調查</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; background: #fdfbf7; color: #333; }
        .card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; margin-top: 0; }
        
        .course-info { background: #f8f9fa; border-left: 4px solid #2b6cb0; padding: 15px 20px; margin-bottom: 25px; border-radius: 4px; font-size: 14px; }
        .course-info h3 { margin: 0 0 10px 0; color: #2b6cb0; font-size: 16px; }
        .course-info p { margin: 6px 0; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        
        /* 紅色必填星號樣式 */
        .required::after {
            content: " *";
            color: #e53e3e;
        }

        input[type="text"], select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .hidden { display: none; }
        button { background: #2b6cb0; color: white; border: none; padding: 12px 20px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2c5282; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        #loading { text-align: center; color: #666; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="pageTitle">會議出席與餐點調查</h2>

    <div class="course-info">
        <h3>課程相關資訊</h3>
        <p><strong>課程名稱：</strong> <span id="configCourseName">讀取中...</span></p>
        <p><strong>課程時間：</strong> <span id="configCourseTime">讀取中...</span></p>
        <p><strong>課程地點：</strong> <span id="configCourseLocation">讀取中...</span></p>
        <p><strong>上課對象：</strong> <span id="configCourseAudience">讀取中...</span></p>
        <p><strong>相關說明：</strong> <span id="configCourseNotice">讀取中...</span></p>
    </div>

    <form id="rsvpForm">
        <div class="form-group">
            <label class="required">姓名：</label>
            <input type="text" id="name" required placeholder="請輸入您的姓名">
        </div>

        <div class="form-group">
            <label class="required">分機：</label>
            <input type="text" id="extension" required placeholder="請輸入您的分機號碼">
        </div>

        <div class="form-group">
            <label class="required">是否出席：</label>
            <select id="attendance" required onchange="toggleOrderSection()">
                <option value="">請選擇</option>
                <option value="參加">參加</option>
                <option value="不參加">不參加</option>
            </select>
        </div>

        <div id="orderSection" class="hidden">
            <div class="form-group">
                <label class="required">餐盒選擇：</label>
                <select id="mealSelect"></select>
            </div>

            <div class="form-group">
                <label class="required">飲料選擇：</label>
                <select id="drinkSelect" onchange="toggleDrinkOptions()"></select>
            </div>

            <div id="drinkOptions" class="form-group hidden">
                <label>冰塊甜度：</label>
                <div style="display: flex; gap: 10px;">
                    <select id="iceSelect">
                        <option value="正常冰">正常冰</option>
                        <option value="少冰">少冰</option>
                        <option value="微冰">微冰</option>
                        <option value="去冰">去冰</option>
                        <option value="常溫">常溫</option>
                        <option value="熱">熱</option>
                    </select>
                    <select id="sugarSelect">
                        <option value="正常甜">正常甜</option>
                        <option value="少糖">少糖</option>
                        <option value="半糖">半糖</option>
                        <option value="微糖">微糖</option>
                        <option value="1分糖">1分糖</option>
                        <option value="無糖">無糖</option>
                        <option value="其他(請於備註填寫)">其他(請於備註填寫)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>備註說明（過敏原、特殊需求等）：</label>
                <textarea id="remark" rows="3" placeholder="若無則免填"></textarea>
            </div>
        </div>

        <button type="submit" id="submitBtn">確認送出</button>
        <div id="loading">資料傳送中，請稍候...</div>
    </form>
</div>

<script>
    const DEFAULT_EVENT = "2026-06-15";
    let currentScriptUrl = "";
    let menuCache = { meals: [], drinks: [] };

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const folder = urlParams.get('event') || DEFAULT_EVENT;
        await loadEventConfigs(folder);
    });

    async function loadEventConfigs(folder) {
        try {
            const configRes = await fetch(`${folder}/config.json`);
            if (!configRes.ok) throw new Error("找不到該場活動的設定檔");
            const config = await configRes.json();
            
            currentScriptUrl = config.scriptUrl;

            document.getElementById('configCourseName').textContent = config.courseName;
            document.getElementById('configCourseTime').textContent = config.courseTime;
            document.getElementById('configCourseLocation').textContent = config.courseLocation;
            document.getElementById('configCourseAudience').textContent = config.courseAudience;
            document.getElementById('configCourseNotice').textContent = config.courseNotice;
            document.getElementById('pageTitle').textContent = config.courseName + " - 出席與餐點調查";

            const menuRes = await fetch(currentScriptUrl);
            menuCache = await menuRes.json();

            // 填入餐盒選項
            const mealSelect = document.getElementById('mealSelect');
            menuCache.meals.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = (item.price !== null && !isNaN(item.price)) ? `${item.name} ($${item.price})` : item.name;
                mealSelect.appendChild(opt);
            });

            // 填入飲料選項（先放從試算表抓出來的飲料）
            const drinkSelect = document.getElementById('drinkSelect');
            menuCache.drinks.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = (item.price !== null && !isNaN(item.price)) ? `${item.name} ($${item.price})` : item.name;
                opt.dataset.customizable = item.customizable; 
                drinkSelect.appendChild(opt);
            });

            // 強制將「不須飲料」放到最下方
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "不須飲料";
            defaultOpt.textContent = "不須飲料";
            drinkSelect.appendChild(defaultOpt);

        } catch (error) {
            console.error('讀取設定檔失敗', error);
            alert('無法載入活動設定與選單，請確認網址或後端指令碼是否正確。');
        }
    }

    function toggleOrderSection() {
        const attendance = document.getElementById('attendance').value;
        const orderSection = document.getElementById('orderSection');
        if (attendance === '參加') {
            orderSection.classList.remove('hidden');
        } else {
            orderSection.classList.add('hidden');
        }
    }

    function toggleDrinkOptions() {
        const drinkSelect = document.getElementById('drinkSelect');
        const selectedOpt = drinkSelect.options[drinkSelect.selectedIndex];
        const drinkOptions = document.getElementById('drinkOptions');
        
        if (drinkSelect.value !== "不須飲料" && selectedOpt.dataset.customizable !== "false") {
            drinkOptions.classList.remove('hidden');
        } else {
            drinkOptions.classList.add('hidden');
        }
    }

    document.getElementById('rsvpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!currentScriptUrl) {
            alert('系統尚未設定對應的後端表單網址！');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        
        submitBtn.disabled = true;
        loading.style.display = 'block';

        const attendance = document.getElementById('attendance').value;
        let mealVal = "未參加";
        let mealPriceVal = 0;
        let drinkVal = "無";
        let drinkPriceVal = 0;
        let iceSugarVal = "無";

        if (attendance === '參加') {
            mealVal = document.getElementById('mealSelect').value;
            const foundMeal = menuCache.meals.find(m => m.name === mealVal);
            if (foundMeal && foundMeal.price) mealPriceVal = foundMeal.price;

            const selectedDrink = document.getElementById('drinkSelect').value;
            const drinkOptionsHidden = document.getElementById('drinkOptions').classList.contains('hidden');
            
            if (selectedDrink !== "不須飲料") {
                drinkVal = selectedDrink;
                const foundDrink = menuCache.drinks.find(d => d.name === selectedDrink);
                if (foundDrink && foundDrink.price) drinkPriceVal = foundDrink.price;

                if (!drinkOptionsHidden) {
                    const ice = document.getElementById('iceSelect').value;
                    const sugar = document.getElementById('sugarSelect').value;
                    iceSugarVal = `${ice} / ${sugar}`;
                }
            }
        }

        const formData = {
            name: document.getElementById('name').value,
            extension: document.getElementById('extension').value,
            attendance: attendance,
            meal: mealVal,
            mealPrice: mealPriceVal,
            drink: drinkVal,
            drinkPrice: drinkPriceVal,
            iceSugar: iceSugarVal,
            remark: document.getElementById('remark').value || '無'
        };

        try {
            await fetch(currentScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
        } catch (error) {
            // 忽略跨域造成的假錯誤
        }

        alert('登記成功！感謝您的填寫。');
        document.getElementById('rsvpForm').reset();
        toggleOrderSection();
        toggleDrinkOptions();

        submitBtn.disabled = false;
        loading.style.display = 'none';
    });
</script>

</body>
</html>
